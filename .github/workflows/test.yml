
name: Test Find Lowest Number

on:
  push:

jobs:
  test:
    name: Run Python Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test with ten numbers
        run: |
          python3 find_lowest_number.py test_data/test1_input.txt output.txt
          diff test_data/test1_expected.txt output.txt

      - name: Test with one number
        run: |
          python3 find_lowest_number.py test_data/test2_input.txt output.txt
          diff test_data/test2_expected.txt output.txt

      - name: Test with blank file
        run: |
          python3 find_lowest_number.py test_data/test3_input.txt output.txt
          diff test_data/test3_expected.txt output.txt
